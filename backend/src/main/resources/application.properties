
# APPLICATION PROPERTIES

spring.application.name=${SPRING.APPLICATION.NAME}

spring.flyway.locations=classpath:db/migration
# Database URL
spring.datasource.url=${POSTGRES_URL}

# PostgreSQL credentials
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate settings
# 'update' automatically creates/updates tables based on your Entities
spring.jpa.hibernate.ddl-auto=update

#*** FLYWAY CONFIG ***
# Turn OFF Hibernate schema changes
# spring.jpa.hibernate.ddl-auto=validate

# Turn ON Flyway database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.execute-in-transaction=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG


# Show the SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=DEBUG

spring.security.user.name=${SPRING.SECURITY.USER}
spring.security.user.password=${SPRING.SECURITY.PASSWORD}
